name: 'Jubelle: Linux Compile Check'

# Compiles the whole Jubelle application on Linux (every module, including
# the home screen, menus, Properties panel and dialogs), without packaging.
# It is a cheap check that all the code compiles before a Windows build.
# The MuseScore unit tests run separately in "Check: Unit Tests", whose
# configuration leaves several interface modules out.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-22.04
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
    - name: Restore ccache files
      uses: actions/cache/restore@v5
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{runner.os}}-${{runner.arch}}-jubelle-app-ccache-
        restore-keys: |
          ${{runner.os}}-${{runner.arch}}-jubelle-app-ccache-
          ${{runner.os}}-${{runner.arch}}-ccache-
    - name: Setup ccache
      run: |
        sudo apt-get update && sudo apt-get install -y ccache
        bash ./buildscripts/ci/tools/setup_ccache_config.sh
    - name: Free up disk space
      run: |
        sudo docker system prune -a -f
        sudo rm -rf /usr/local/lib/android
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.10.2
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets'
        cache: true
    - name: Setup environment
      run: |
        bash ./buildscripts/ci/linux/setup.sh
    - name: Compile the application
      run: |
        source $HOME/build_tools/environment.sh
        MUSE_APP_BUILD_MODE=dev \
        MUSESCORE_BUILD_NUMBER=1 \
        MUSESCORE_REVISION=$(git rev-parse --short=7 HEAD) \
        MUSESCORE_DOWNLOAD_SOUNDFONT=OFF \
        bash ./ninja_build.sh -t release 2>&1 | tee build.log
        test ${PIPESTATUS[0]} -eq 0
    - name: List compile errors
      if: failure()
      run: |
        grep -n -E "error:|undefined reference|Error [0-9]" build.log | head -200 || true
    - name: Show ccache stats
      if: always()
      run: ccache -sv || true
    - name: Save ccache files
      if: always()
      uses: actions/cache/save@v5
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{runner.os}}-${{runner.arch}}-jubelle-app-ccache-${{ github.run_id }}
