name: 'Check: Unit Tests (utest)'

on:
  push:
    branches: [ main, 'stavelle/**', 'jubelle/**' ]
  pull_request:
  workflow_dispatch:
    inputs:
      code_coverage:
        description: 'Enable code coverage'
        required: false
        type: boolean
        default: false

# Jubelle: new repositories give workflows read-only tokens by default; the
# "Cancel Previous Runs" step needs to manage runs.
permissions:
  contents: read
  actions: write

jobs:
  run_tests:
    runs-on: ubuntu-22.04
    steps:
    - name: Cancel Previous Runs
      uses: styfle/cancel-workflow-action@0.13.0
      with:
        access_token: ${{ github.token }}
    - name: Clone repository
      uses: actions/checkout@v6
    - name: "Configure workflow"
      run: |
        bash ./buildscripts/ci/tools/make_build_number.sh
        BUILD_NUMBER=$(cat ./build.artifacts/env/build_number.env)

        echo "BUILD_NUMBER=$BUILD_NUMBER" | tee -a $GITHUB_ENV

    - name: Restore ccache files
      id: restore-ccache
      uses: actions/cache/restore@v5
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{runner.os}}-${{runner.arch}}-utests-ccache-
        restore-keys: |
          ${{runner.os}}-${{runner.arch}}-utests-ccache-
          ${{runner.os}}-${{runner.arch}}-ccache-
    - name: Setup ccache
      run: |
        sudo apt-get update && sudo apt-get install -y ccache
        bash ./buildscripts/ci/tools/setup_ccache_config.sh

    - name: Free up disk space
      run: |
        sudo docker system prune -a -f
        sudo rm -rf /usr/local/lib/android

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.10.2
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets'
        cache: true
    - name: Setup environment
      run: |
        bash ./buildscripts/ci/linux/setup.sh

    - name: Build
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        CODE_COVERAGE: ${{ inputs.code_coverage }}
      run: |
        mkdir -p build.artifacts/env

        ENABLE_CODE_COVERAGE='false'

        if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$CODE_COVERAGE" == true ]]; then
          ENABLE_CODE_COVERAGE='true'
        else
          ENABLE_CODE_COVERAGE='false'
        fi

        bash ./buildscripts/ci/linux/build_utest.sh -n ${{ env.BUILD_NUMBER }} --enable_code_coverage ${ENABLE_CODE_COVERAGE}

    - name: Show ccache stats
      run: |
        ccache -sv
    - name: Run tests
      run: |
        bash ./buildscripts/ci/linux/runutests.sh
      env:
        ASAN_OPTIONS: "detect_leaks=0"

    - name: Code coverage
      if: ( github.event_name == 'schedule' || inputs.code_coverage ) && github.repository == 'musescore/MuseScore'
      run: |
        lcov --capture --directory "$(pwd)/build.debug/" --output-file coverage.info
        lcov --remove coverage.info '/usr/*' '*/tests/*' '*/thirdparty/*' '*/moc_*' '*framework/Headers/*' '*/hb-*' '*/Qt/*' --output-file filtered_coverage.info

        python3 buildscripts/ci/linux/tools/lcov_badger.py filtered_coverage.info coverage_badge.svg

    - name: Push to S3
      if: ( github.event_name == 'schedule' || inputs.code_coverage ) && github.repository == 'musescore/MuseScore'
      run: |
        S3_URL='s3://extensions.musescore.org/test/code_coverage/coverage_badge.svg'

        bash ./buildscripts/ci/tools/s3_push_file.sh \
          --s3_key '${{ secrets.S3_KEY }}' \
          --s3_secret '${{ secrets.S3_SECRET }}' \
          --s3_url "${S3_URL}" \
          --file_path "coverage_badge.svg"

    - name: Prepare ccache files for saving
      id: prepare-save-ccache
      if: always() && github.event_name != 'pull_request'
      run: |
        ccache --recompress 10
        echo "CCACHE_TIMESTAMP=$(date -u +"%F-%T")" | tee -a $GITHUB_OUTPUT
    - name: Save ccache files
      if: always() && github.event_name != 'pull_request'
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-ccache.outputs.cache-primary-key }}${{ steps.prepare-save-ccache.outputs.CCACHE_TIMESTAMP }}
        path: ${{ github.workspace }}/.ccache

  # Jubelle: compiles the whole application (every module, including the home
  # screen, menus, Properties panel and dialogs, which the utest configuration
  # leaves out), without packaging. Runs alongside the unit tests when the
  # workflow is started by hand.
  jubelle_app_compile:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
    - name: Restore ccache files
      uses: actions/cache/restore@v5
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{runner.os}}-${{runner.arch}}-jubelle-app-ccache-
        restore-keys: |
          ${{runner.os}}-${{runner.arch}}-jubelle-app-ccache-
          ${{runner.os}}-${{runner.arch}}-ccache-
    - name: Setup ccache
      run: |
        sudo apt-get update && sudo apt-get install -y ccache
        bash ./buildscripts/ci/tools/setup_ccache_config.sh
    - name: Free up disk space
      run: |
        sudo docker system prune -a -f
        sudo rm -rf /usr/local/lib/android
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.10.2
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets'
        cache: true
    - name: Setup environment
      run: |
        bash ./buildscripts/ci/linux/setup.sh
    - name: Compile the application
      run: |
        source $HOME/build_tools/environment.sh
        MUSE_APP_BUILD_MODE=dev \
        MUSESCORE_BUILD_NUMBER=1 \
        MUSESCORE_REVISION=$(git rev-parse --short=7 HEAD) \
        MUSESCORE_DOWNLOAD_SOUNDFONT=OFF \
        bash ./ninja_build.sh -t release 2>&1 | tee build.log
        test ${PIPESTATUS[0]} -eq 0
    - name: List compile errors
      if: failure()
      run: |
        grep -n -E "error:|undefined reference|Error [0-9]" build.log | head -200 || true
    - name: Show ccache stats
      if: always()
      run: ccache -sv || true
    - name: Save ccache files
      if: always()
      uses: actions/cache/save@v5
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{runner.os}}-${{runner.arch}}-jubelle-app-ccache-${{ github.run_id }}
