name: 'Jubelle: Coexistence Test (Windows)'

# Installs the official MuseScore, then a Jubelle installer produced by an earlier
# "Build: Windows" run, and checks that the two coexist independently. It reuses the
# saved installer, so it takes minutes instead of rebuilding the application (~75 min).
#
# Runs automatically after every successful "Build: Windows" run, or on request with the
# run ID of the build whose installer should be tested.

# File name kept as stavelle_coexistence.yml: GitHub only allows starting a workflow by hand
# under the file name it knows from the default branch.
#
# Manual-only for now (14 Nov): two runs hung with the build machine itself becoming
# unresponsive. Re-enable the automatic run after a successful Windows build once the
# hardened test has been confirmed on request.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Run ID of the "Build: Windows" run whose installer to test (0: skip Windows)'
        required: true
      macos_run_id:
        description: 'Optional: run ID of a "Build: macOS" run whose disk image to install and run on macOS'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  coexistence:
    if: ${{ inputs.build_run_id != '0' }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
    - name: Download the Jubelle installer from the build run
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BUILD_RUN_ID: ${{ inputs.build_run_id }}
      timeout-minutes: 10
      run: |
        echo "Using installer from Build: Windows run $BUILD_RUN_ID"
        mkdir -p jubelle_artifact
        ART=$(gh api "repos/${{ github.repository }}/actions/runs/$BUILD_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name | startswith("MU4_"))][0].name')
        echo "Artifact: $ART"
        gh run download "$BUILD_RUN_ID" --repo "${{ github.repository }}" --name "$ART" --dir jubelle_artifact
        ls -la jubelle_artifact
    - name: Download the official MuseScore installer
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 10
      run: |
        mkdir -p musescore_msi
        gh release download v4.7.7 --repo musescore/MuseScore --pattern "*x86_64.msi" --dir musescore_msi \
          || gh release download --repo musescore/MuseScore --pattern "*x86_64.msi" --dir musescore_msi
        ls -la musescore_msi
    - name: Coexistence test (with negative control)
      shell: bash
      timeout-minutes: 35
      run: |
        JUBELLE_MSI=$(ls jubelle_artifact/*.msi | head -1)
        MUSESCORE_MSI=$(ls musescore_msi/*.msi | head -1)
        echo "Jubelle installer:  $JUBELLE_MSI"
        echo "MuseScore installer: $MUSESCORE_MSI"
        python -X utf8 -u tools/jubelle_checks/coexistence_test_windows.py "$MUSESCORE_MSI" "$JUBELLE_MSI" demos/Amazing_grace.mscz coexistence_work
    - name: Upload results and installer logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: jubelle-coexistence-windows
        path: coexistence_work/

  macos_install:
    if: ${{ inputs.macos_run_id != '' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Download the disk image
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.macos_run_id }}
        run: |
          set -e
          ART=$(gh api "repos/${{ github.repository }}/actions/runs/$BUILD_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name | startswith("MU4_"))][0].name')
          echo "Artifact: $ART"
          gh run download "$BUILD_RUN_ID" --repo "${{ github.repository }}" --name "$ART" --dir dmg_artifact
          ls -la dmg_artifact

      - name: Install from the disk image and run the installed app
        run: |
          set -e
          DMG=$(find dmg_artifact -name 'Jubelle-*.dmg' | head -1)
          [ -n "$DMG" ] || { echo "FAIL: no Jubelle disk image"; exit 1; }
          echo "Disk image: $DMG"
          {
            echo "# macOS installation check"
            echo
            echo "- disk image: \`$(basename "$DMG")\` ($(du -h "$DMG" | cut -f1))"
          } > install_check.md
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT" > /dev/null
          APP=$(find "$MNT" -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "FAIL: no app in the disk image"; hdiutil detach "$MNT"; exit 1; }
          echo "- app in the disk image: \`$(basename "$APP")\`" >> install_check.md
          [ -L "$MNT/Applications" ] && echo "- Applications shortcut for drag-to-install: yes" >> install_check.md || echo "- Applications shortcut for drag-to-install: no" >> install_check.md
          rm -rf "/Applications/$(basename "$APP")"
          cp -R "$APP" /Applications/
          hdiutil detach "$MNT" > /dev/null
          INSTALLED="/Applications/$(basename "$APP")"
          NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleName" "$INSTALLED/Contents/Info.plist" 2>/dev/null || true)
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INSTALLED/Contents/Info.plist" 2>/dev/null || true)
          echo "- installed as: \`$INSTALLED\` (name \"$NAME\", version $VERSION)" >> install_check.md
          codesign --verify --deep "$INSTALLED" 2>/dev/null && echo "- code signature (ad hoc) intact after copying: yes" >> install_check.md || echo "- code signature intact after copying: NO" >> install_check.md
          EXE=$(find "$INSTALLED/Contents/MacOS" -maxdepth 1 -type f -perm -u+x | head -1)
          mkdir -p out
          set +e
          "$EXE" -o out/Amazing_grace.pdf demos/Amazing_grace.mscz > out/app.log 2>&1
          RC=$?
          "$EXE" -o out/Amazing_grace.mp3 demos/Amazing_grace.mscz >> out/app.log 2>&1
          RC2=$?
          set -e
          PDF=$( [ -s out/Amazing_grace.pdf ] && echo yes || echo no )
          MP3=$( [ -s out/Amazing_grace.mp3 ] && echo yes || echo no )
          echo "- the installed app exported a PDF: $PDF (exit code $RC)" >> install_check.md
          echo "- the installed app exported an MP3: $MP3 (exit code $RC2)" >> install_check.md
          if [ "$NAME" = "Jubelle" ] && [ "$PDF" = yes ] && [ "$MP3" = yes ]; then
            echo "" >> install_check.md; echo "**Result: PASS**" >> install_check.md
          else
            echo "" >> install_check.md; echo "**Result: FAIL**" >> install_check.md
          fi
          cat install_check.md
          cat install_check.md >> "$GITHUB_STEP_SUMMARY"
          grep -q "Result: PASS" install_check.md
