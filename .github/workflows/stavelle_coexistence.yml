name: 'Stavelle: Coexistence Test (Windows)'

# Installs the official MuseScore, then a Stavelle installer produced by an earlier
# "Build: Windows" run, and checks that the two coexist independently. It reuses the
# saved installer, so it takes minutes instead of rebuilding the application (~75 min).
#
# Runs automatically after every successful "Build: Windows" run, or on request with the
# run ID of the build whose installer should be tested.

on:
  workflow_run:
    workflows: [ 'Build: Windows' ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Run ID of the "Build: Windows" run whose installer to test'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  coexistence:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
    - name: Download the Stavelle installer from the build run
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BUILD_RUN_ID: ${{ inputs.build_run_id || github.event.workflow_run.id }}
      timeout-minutes: 10
      run: |
        echo "Using installer from Build: Windows run $BUILD_RUN_ID"
        mkdir -p stavelle_artifact
        ART=$(gh api "repos/${{ github.repository }}/actions/runs/$BUILD_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name | startswith("MU4_"))][0].name')
        echo "Artifact: $ART"
        gh run download "$BUILD_RUN_ID" --repo "${{ github.repository }}" --name "$ART" --dir stavelle_artifact
        ls -la stavelle_artifact
    - name: Download the official MuseScore installer
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 10
      run: |
        mkdir -p musescore_msi
        gh release download v4.7.7 --repo musescore/MuseScore --pattern "*x86_64.msi" --dir musescore_msi \
          || gh release download --repo musescore/MuseScore --pattern "*x86_64.msi" --dir musescore_msi
        ls -la musescore_msi
    - name: Coexistence test (with negative control)
      shell: bash
      timeout-minutes: 25
      run: |
        STAVELLE_MSI=$(ls stavelle_artifact/*.msi | head -1)
        MUSESCORE_MSI=$(ls musescore_msi/*.msi | head -1)
        echo "Stavelle installer:  $STAVELLE_MSI"
        echo "MuseScore installer: $MUSESCORE_MSI"
        python -X utf8 -u tools/stavelle_smoke/coexistence_test_windows.py "$MUSESCORE_MSI" "$STAVELLE_MSI" demos/Amazing_grace.mscz coexistence_work
    - name: Upload results and installer logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: stavelle-coexistence-windows
        path: coexistence_work/
