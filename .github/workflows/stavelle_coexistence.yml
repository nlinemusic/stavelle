name: 'Jubelle: Coexistence Test (Windows)'

# Installs the official MuseScore, then a Jubelle installer produced by an earlier
# "Build: Windows" run, and checks that the two coexist independently. It reuses the
# saved installer, so it takes minutes instead of rebuilding the application (~75 min).
#
# Runs automatically after every successful "Build: Windows" run, or on request with the
# run ID of the build whose installer should be tested.

# Manual-only for now (14 Nov): two runs hung with the build machine itself becoming
# unresponsive. Re-enable the automatic run after a successful Windows build once the
# hardened test has been confirmed on request.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Run ID of the "Build: Windows" run whose installer to test'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  coexistence:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
    - name: Download the Jubelle installer from the build run
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BUILD_RUN_ID: ${{ inputs.build_run_id }}
      timeout-minutes: 10
      run: |
        echo "Using installer from Build: Windows run $BUILD_RUN_ID"
        mkdir -p jubelle_artifact
        ART=$(gh api "repos/${{ github.repository }}/actions/runs/$BUILD_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name | startswith("MU4_"))][0].name')
        echo "Artifact: $ART"
        gh run download "$BUILD_RUN_ID" --repo "${{ github.repository }}" --name "$ART" --dir jubelle_artifact
        ls -la jubelle_artifact
    - name: Download the official MuseScore installer
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 10
      run: |
        mkdir -p musescore_msi
        gh release download v4.7.7 --repo musescore/MuseScore --pattern "*x86_64.msi" --dir musescore_msi \
          || gh release download --repo musescore/MuseScore --pattern "*x86_64.msi" --dir musescore_msi
        ls -la musescore_msi
    - name: Coexistence test (with negative control)
      shell: bash
      timeout-minutes: 20
      run: |
        JUBELLE_MSI=$(ls jubelle_artifact/*.msi | head -1)
        MUSESCORE_MSI=$(ls musescore_msi/*.msi | head -1)
        echo "Jubelle installer:  $JUBELLE_MSI"
        echo "MuseScore installer: $MUSESCORE_MSI"
        python -X utf8 -u tools/jubelle_checks/coexistence_test_windows.py "$MUSESCORE_MSI" "$JUBELLE_MSI" demos/Amazing_grace.mscz coexistence_work
    - name: Upload results and installer logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: jubelle-coexistence-windows
        path: coexistence_work/
