name: 'Build: Windows'

on:
  push:
    branches: [ main, 'stavelle/**', 'jubelle/**' ]
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build:'
        default: 'windows_x64 windows_portable'
        required: true
      build_mode:
        description: 'Build mode: devel, nightly, testing, stable'
        default: 'devel'
        required: true
      publish:
        description: 'Publish to FTP: on - publish'
        default: 'off'
        required: false
      sentry_project:
        description: 'Upload symbols and dumps to Sentry (choose a project): mu4(default for stable build), mu4-sandbox'
        default: ''
        required: false
  workflow_call:
    inputs:
      platforms:
        description: 'Platforms to build:'
        default: 'windows_x64 windows_portable'
        type: string
        required: true
      build_mode:
        description: 'Build mode: devel, nightly, testing, stable'
        default: 'devel'
        type: string
        required: true
      publish:
        description: 'Publish to FTP: on - publish'
        default: 'off'
        type: string
        required: false
      sentry_project:
        description: 'Upload symbols and dumps to Sentry (choose a project): mu4(default for stable build), mu4-sandbox'
        default: ''
        type: string
        required: false
      build_number:
        description: "Build number (if not provided, will be generated)"
        default: ""
        type: string
        required: false

# Jubelle: new repositories give workflows read-only tokens by default; the
# "Cancel Previous Runs" step needs to manage runs.
permissions:
  contents: read
  actions: write

jobs:
  windows_x64:
    if: github.event_name != 'workflow_dispatch' || contains(inputs.platforms, 'windows_x64')
    runs-on: windows-2025
    steps:
    - name: Cancel Previous Runs
      uses: styfle/cancel-workflow-action@0.13.0
      with:
        access_token: ${{ github.token }}
    - name: Clone repository
      uses: actions/checkout@v6
    - name: Configure workflow
      shell: bash
      env:
        pull_request_title: ${{ github.event.pull_request.title }}
        SENTRY_MUSE_MU4_KEY: ${{ secrets.SENTRY_MUSE_MU4_KEY }}
        SENTRY_MUSE_MU4_SANDBOX_KEY: ${{ secrets.SENTRY_MUSE_MU4_SANDBOX_KEY }}
        SENTRY_PROJECT: ${{ inputs.sentry_project }}
      run: |
        bash ./buildscripts/ci/tools/make_build_mode_env.sh -e ${{ github.event_name }} -m ${{ inputs.build_mode }}
        BUILD_MODE=$(cat ./build.artifacts/env/build_mode.env)

        if [ -n "${{ inputs.build_number }}" ]; then
          BUILD_NUMBER="${{ inputs.build_number }}"
          bash ./buildscripts/ci/tools/make_build_number.sh "$BUILD_NUMBER"
        else
          bash ./buildscripts/ci/tools/make_build_number.sh
        fi
        BUILD_NUMBER=$(cat ./build.artifacts/env/build_number.env)

        DO_UPDATE_TS='false'
        if [[ "$BUILD_MODE" == "testing" || "$BUILD_MODE" == "stable" ]]; then
          DO_UPDATE_TS='true'
          if [ -z "${{ secrets.TRANSIFEX_API_TOKEN }}" ]; then
            echo "::warning::TRANSIFEX_API_TOKEN is empty; updating .ts files disabled"
            DO_UPDATE_TS='false'
          fi
        fi

        DO_PLACEHOLDER_TRANSLATIONS='false'
        if [[ "$BUILD_MODE" == "nightly" || "$BUILD_MODE" == "devel" ]]; then
          DO_PLACEHOLDER_TRANSLATIONS='true'
        fi

        DO_UPLOAD_SYMBOLS='false'
        SENTRY_URL=""

        if [ "$SENTRY_MUSE_MU4_KEY" != "" ]; then
          if [ -z "$SENTRY_PROJECT" ] && [ "$BUILD_MODE" == "stable" ]; then
            SENTRY_PROJECT="mu4"
          fi

          if [ "$SENTRY_PROJECT" == "mu4" ]; then
            DO_UPLOAD_SYMBOLS='true'
            SENTRY_URL=https://sentry.musescore.com/api/4/minidump/?sentry_key=$SENTRY_MUSE_MU4_KEY
          fi
        fi

        if [ -z "$SENTRY_PROJECT" ] && [ "$BUILD_MODE" == "nightly" ]; then
          # DO_UPLOAD_SYMBOLS is turned off because the files are large, and sending them every night is costly
          SENTRY_URL=https://sentry.musescore.com/api/3/minidump/?sentry_key=$SENTRY_MUSE_MU4_SANDBOX_KEY
        fi

        if [ "$SENTRY_PROJECT" == "mu4-sandbox" ] && [ "$SENTRY_MUSE_MU4_SANDBOX_KEY" != "" ]; then
          DO_UPLOAD_SYMBOLS='true'
          SENTRY_URL=https://sentry.musescore.com/api/3/minidump/?sentry_key=$SENTRY_MUSE_MU4_SANDBOX_KEY
        fi

        DO_PUBLISH='false'
        if [ "${{ inputs.publish }}" == "on" ]; then
          DO_PUBLISH='true'
          if [ -z "${{ secrets.OSUOSL_SSH_ENCRYPT_SECRET }}" ]; then
            echo "::warning::OSUOSL_SSH_ENCRYPT_SECRET is empty; not publishing to OSUOSL"
            DO_PUBLISH='false'
          fi
        fi

        ADD_INFO="_${GITHUB_REF#refs/heads/}"
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          ADD_INFO="_${{ github.event.pull_request.number }}_${pull_request_title}"
        fi
        UPLOAD_ARTIFACT_NAME="$(tr '":<>|*?/\\’' '_' <<<"MU4_${BUILD_NUMBER}_Win${ADD_INFO}")"

        echo "github.repository: ${{ github.repository }}"
        echo "BUILD_MODE=$BUILD_MODE" | tee -a $GITHUB_ENV
        echo "BUILD_NUMBER=$BUILD_NUMBER" | tee -a $GITHUB_ENV
        echo "DO_UPDATE_TS=$DO_UPDATE_TS" | tee -a $GITHUB_ENV
        echo "DO_PLACEHOLDER_TRANSLATIONS=$DO_PLACEHOLDER_TRANSLATIONS" | tee -a $GITHUB_ENV
        echo "DO_UPLOAD_SYMBOLS=$DO_UPLOAD_SYMBOLS" | tee -a $GITHUB_ENV
        echo "SENTRY_PROJECT=$SENTRY_PROJECT" | tee -a $GITHUB_ENV
        echo "SENTRY_URL=$SENTRY_URL" | tee -a $GITHUB_ENV
        echo "DO_PUBLISH=$DO_PUBLISH" | tee -a $GITHUB_ENV
        echo "UPLOAD_ARTIFACT_NAME=$UPLOAD_ARTIFACT_NAME" | tee -a $GITHUB_ENV

    # Jubelle G9: built-in video export. Fetched and checked first, so a missing or
    # wrongly licensed FFmpeg stops the build before the long compile, not after it.
    - name: "Jubelle: fetch FFmpeg for video export (LGPL build only)"
      shell: bash
      run: |
        python -X utf8 tools/jubelle_checks/bundle_ffmpeg.py fetch ffmpeg_stage

    - name: Restore ccache files
      id: restore-ccache
      uses: actions/cache/restore@v5
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{runner.os}}-${{runner.arch}}-ccache-
        restore-keys: ${{runner.os}}-${{runner.arch}}-ccache-
    - name: Setup ccache
      run: |
        choco install -y ccache
        bash ./buildscripts/ci/tools/setup_ccache_config.sh

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.10.2
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets'
        cache: true
    - name: Setup environment
      run: |
        buildscripts\ci\windows\setup.bat

    - name: Generate _en.ts files
      shell: bash
      env:
        LUPDATE_ARGS: ""
        POSTPROCESS_ARGS: "--warn-only ${{ env.DO_PLACEHOLDER_TRANSLATIONS == 'true' && '--generate-placeholder-translations' || '' }}"
        POSTPROCESS_LAUNCHER: "python3 -X utf8"
      run: |
        bash ./tools/translations/run_lupdate.sh
    - name: Update .ts files (tx pull)
      if: env.DO_UPDATE_TS == 'true'
      uses: cbjeukendrup/cli-action@windows
      with:
        token: ${{ secrets.TRANSIFEX_API_TOKEN }}
        args: "pull -f"

    - name: Register msvc problem matcher
      run: echo "::add-matcher::.github/problem_matchers/msvc.json"

    - name: Build
      shell: cmd
      env:
        # Jubelle R3: the public half of the release signing key (a repository
        # variable, not a secret); without it the build refuses every update
        JUBELLE_RELEASE_PUBLIC_KEY: ${{ vars.JUBELLE_RELEASE_PUBLIC_KEY }}
      run: |
        IF ${{ env.SENTRY_URL != 0 }} == true ( SET C_URL="${{ env.SENTRY_URL }}" ) ELSE ( SET C_URL="" )
        SET NINJA_EXTRA_ARGS=-k 0
        buildscripts\ci\windows\build.bat -n ${{ env.BUILD_NUMBER }} --crash_log_url %C_URL%
    - name: Show ccache stats
      run: |
        ccache -sv
    - name: "Jubelle: bundle FFmpeg (libraries, licence and notice next to the program)"
      shell: bash
      run: |
        python -X utf8 tools/jubelle_checks/bundle_ffmpeg.py install ffmpeg_stage build.install/bin
    - name: "Jubelle: app check (open, save, reopen, identity, timing)"
      timeout-minutes: 30
      shell: bash
      run: |
        # Jubelle's updater may only look at Jubelle's own signed GitHub releases,
        # never at MuseScore's update servers
        python -X utf8 tools/jubelle_checks/check_update_feed.py src/app/configs/update.cfg "build.install/bin/Jubelle.exe"
        mkdir -p smoke_scores
        cp demos/*.mscz demos/Dawn.mscx smoke_scores/
        python -X utf8 tools/jubelle_checks/make_large_score.py demos/Dawn.mscx smoke_scores/Large_Orchestra_39_staves_285_bars.mscx --instruments 3 --measures 15
        python -X utf8 tools/jubelle_checks/smoke_test.py "build.install/bin/Jubelle.exe" smoke_scores smoke_work --runs 3
    - name: "Jubelle: release key built in (the updater can verify signed releases)"
      shell: bash
      env:
        JUBELLE_RELEASE_PUBLIC_KEY: ${{ vars.JUBELLE_RELEASE_PUBLIC_KEY }}
      run: |
        if [ -z "$JUBELLE_RELEASE_PUBLIC_KEY" ]; then
          echo "::warning::No release key is set up: this build will refuse every update"
          echo "- release key: **not set up** (this build refuses every update)" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        python -X utf8 - "$JUBELLE_RELEASE_PUBLIC_KEY" build.install/bin <<'PY'
        import pathlib, sys
        key, folder = sys.argv[1].lower().encode(), pathlib.Path(sys.argv[2])
        found = [p.name for p in folder.iterdir() if p.suffix.lower() in (".exe", ".dll") and key in p.read_bytes().lower()]
        print("release key found in:", ", ".join(found) or "nothing")
        sys.exit(0 if found else 1)
        PY
        echo "- release key: built in (public key $JUBELLE_RELEASE_PUBLIC_KEY)" >> "$GITHUB_STEP_SUMMARY"
    - name: "Jubelle: upload app check results"
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: jubelle-app-check-${{ runner.os }}
        path: |
          smoke_work/smoke_results.json
          smoke_work/profile_*.txt
    - name: "Jubelle: interface self-test (every Jubelle window and panel opens, no QML errors)"
      # reported, not fatal: a failure here must not throw away the build
      if: always()
      continue-on-error: true
      timeout-minutes: 15
      shell: bash
      run: |
        python -X utf8 tools/jubelle_checks/ui_selftest.py "build.install/bin/Jubelle.exe" tools/jubelle_checks/data/Jubelle_features.mscz ui_selftest
        cat ui_selftest/ui_selftest.md >> "$GITHUB_STEP_SUMMARY"
    - name: "Jubelle: video export check (MP4 with the bundled FFmpeg)"
      # reported, not fatal: a failure here must not throw away a three-hour build
      if: always()
      continue-on-error: true
      timeout-minutes: 25
      shell: bash
      run: |
        python -X utf8 tools/jubelle_checks/video_export_check.py "build.install/bin/Jubelle.exe" demos/Amazing_grace.mscz video_check ffmpeg_stage/tools/ffmpeg.exe
        cat video_check/video_check.md >> "$GITHUB_STEP_SUMMARY"
    - name: "Jubelle: upload video export check"
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: jubelle-video-check
        path: |
          video_check/video_check.md
          video_check/video_check.mp4
    - name: "Jubelle: audio export check (bit depth and sample rate of WAV, FLAC, MP3, OGG)"
      if: always()
      continue-on-error: true
      timeout-minutes: 30
      shell: bash
      run: |
        python -X utf8 tools/jubelle_checks/audio_export_check.py "build.install/bin/Jubelle.exe" demos/Amazing_grace.mscz audio_check
        cat audio_check/audio_check.md >> "$GITHUB_STEP_SUMMARY"
    - name: "Jubelle: upload audio export check"
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: jubelle-audio-check
        path: audio_check/audio_check.md
    - name: "Jubelle: template prints (PDF, for visual review)"
      if: always()
      timeout-minutes: 30
      shell: bash
      run: |
        python -X utf8 tools/jubelle_checks/template_prints.py "build.install/bin/Jubelle.exe" template_prints
    - name: "Jubelle: upload template prints"
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: jubelle-template-prints
        path: template_prints/
    - name: Package
      shell: cmd
      env:
        # packaging configures again: the same release key, so nothing is rebuilt
        JUBELLE_RELEASE_PUBLIC_KEY: ${{ vars.JUBELLE_RELEASE_PUBLIC_KEY }}
      run: |
        :: Jubelle: no code-signing certificate, and the installer uses Jubelle's own
        :: upgrade code (set in package.bat), never MuseScore's.
        buildscripts\ci\windows\package.bat
    - name: Checksum
      run: |
        bash ./buildscripts/ci/tools/checksum.sh
    - name: "Jubelle: release key inside the installer"
      shell: bash
      env:
        JUBELLE_RELEASE_PUBLIC_KEY: ${{ vars.JUBELLE_RELEASE_PUBLIC_KEY }}
      run: |
        if [ -z "$JUBELLE_RELEASE_PUBLIC_KEY" ]; then exit 0; fi
        # devel builds make no installer; every build that makes one is checked
        if ! ls build.artifacts/*.msi >/dev/null 2>&1; then
          if [ "${{ inputs.build_mode }}" = "devel" ]; then
            echo "- release key inside the installer: no installer in a devel build (not checked)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::no installer was built"; exit 1
        fi
        MSI=$(ls build.artifacts/*.msi | head -1)
        mkdir -p msi_unpacked
        # an administrative install only unpacks the files; nothing is installed
        cmd //c "msiexec /a $(cygpath -w "$MSI") /qn TARGETDIR=$(cygpath -w "$PWD/msi_unpacked")"
        python -X utf8 - "$JUBELLE_RELEASE_PUBLIC_KEY" msi_unpacked <<'PY'
        import pathlib, sys
        key, folder = sys.argv[1].lower().encode(), pathlib.Path(sys.argv[2])
        exes = [p for p in folder.rglob("Jubelle.exe")]
        found = [str(p) for p in exes if key in p.read_bytes().lower()]
        print("Jubelle.exe in the installer:", [str(p) for p in exes])
        print("release key found in:", found or "nothing")
        sys.exit(0 if found else 1)
        PY
        echo "- release key inside the installer: yes" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload debug files
      if: env.DO_UPLOAD_SYMBOLS == 'true'
      shell: bash
      env:
        SENTRY_URL: https://sentry.musescore.com
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_MUSE_AUTH_TOKEN }}
        SENTRY_ORG: sentry
      run: |
        PDB=$(find build.release -name 'MuseScore*.pdb' -print -quit)
        if [ -z "$PDB" ]; then echo "error: pdb not found"; exit 1; fi

        EXE=$(find build.install -name "$(basename "$PDB" .pdb).exe" -print -quit)
        if [ -z "$EXE" ]; then echo "error: exe not found"; exit 1; fi

        bash ./buildscripts/ci/tools/sentry/upload_debug_files.sh "$PDB" "$EXE"

    - name: Publish to OSUOSL
      if: env.DO_PUBLISH == 'true'
      shell: bash
      run: |
        bash ./buildscripts/ci/tools/osuosl/publish.sh -s ${{ secrets.OSUOSL_SSH_ENCRYPT_SECRET }} --os windows -v 4
    - name: Upload artifacts on GitHub
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ env.UPLOAD_ARTIFACT_NAME }}
        path: build.artifacts\

    - name: Prepare ccache files for saving
      id: prepare-save-ccache
      if: always() && github.event_name != 'pull_request'
      shell: bash
      run: |
        ccache --recompress 10
        echo "CCACHE_TIMESTAMP=$(date -u +"%F-%T")" | tee -a $GITHUB_OUTPUT
    - name: Save ccache files
      if: always() && github.event_name != 'pull_request'
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-ccache.outputs.cache-primary-key }}${{ steps.prepare-save-ccache.outputs.CCACHE_TIMESTAMP }}
        path: ${{ github.workspace }}/.ccache


  windows_portable:
    # Jubelle: portable build only when explicitly requested (saves build minutes)
    if: |
      github.event_name == 'workflow_dispatch' && contains(inputs.platforms, 'windows_portable')
    runs-on: windows-2025
    steps:
    - name: Cancel Previous Runs
      uses: styfle/cancel-workflow-action@0.13.0
      with:
        access_token: ${{ github.token }}
    - name: Clone repository
      uses: actions/checkout@v6
    - name: Configure workflow
      shell: bash
      env:
        pull_request_title: ${{ github.event.pull_request.title }}
      run: |
        bash ./buildscripts/ci/tools/make_build_mode_env.sh -e ${{ github.event_name }} -m ${{ inputs.build_mode }}
        BUILD_MODE=$(cat ./build.artifacts/env/build_mode.env)

        if [ -n "${{ inputs.build_number }}" ]; then
          BUILD_NUMBER="${{ inputs.build_number }}"
          bash ./buildscripts/ci/tools/make_build_number.sh "$BUILD_NUMBER"
        else
          bash ./buildscripts/ci/tools/make_build_number.sh
        fi
        BUILD_NUMBER=$(cat ./build.artifacts/env/build_number.env)

        DO_UPDATE_TS='false'
        if [[ "$BUILD_MODE" == "testing" || "$BUILD_MODE" == "stable" ]]; then
          DO_UPDATE_TS='true'
          if [ -z "${{ secrets.TRANSIFEX_API_TOKEN }}" ]; then
            echo "::warning::TRANSIFEX_API_TOKEN is empty; updating .ts files disabled"
            DO_UPDATE_TS='false'
          fi
        fi

        DO_PLACEHOLDER_TRANSLATIONS='false'
        if [[ "$BUILD_MODE" == "nightly" || "$BUILD_MODE" == "devel" ]]; then
          DO_PLACEHOLDER_TRANSLATIONS='true'
        fi

        DO_PUBLISH='false'
        if [ "${{ inputs.publish }}" == "on" ]; then
          DO_PUBLISH='true'
          if [ -z "${{ secrets.OSUOSL_SSH_ENCRYPT_SECRET }}" ]; then
            echo "::warning::OSUOSL_SSH_ENCRYPT_SECRET is empty; not publishing to OSUOSL"
            DO_PUBLISH='false'
          fi
        fi

        ADD_INFO="_${GITHUB_REF#refs/heads/}"
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          ADD_INFO="_${{ github.event.pull_request.number }}_${pull_request_title}"
        fi
        UPLOAD_ARTIFACT_NAME="$(tr '":<>|*?/\\’' '_' <<<"MU4_${BUILD_NUMBER}_Win_portable${ADD_INFO}")"

        echo "github.repository: ${{ github.repository }}"
        echo "BUILD_MODE=$BUILD_MODE" | tee -a $GITHUB_ENV
        echo "BUILD_NUMBER=$BUILD_NUMBER" | tee -a $GITHUB_ENV
        echo "DO_UPDATE_TS=$DO_UPDATE_TS" | tee -a $GITHUB_ENV
        echo "DO_PLACEHOLDER_TRANSLATIONS=$DO_PLACEHOLDER_TRANSLATIONS" | tee -a $GITHUB_ENV
        echo "DO_PUBLISH=$DO_PUBLISH" | tee -a $GITHUB_ENV
        echo "UPLOAD_ARTIFACT_NAME=$UPLOAD_ARTIFACT_NAME" | tee -a $GITHUB_ENV

    - name: Restore ccache files
      id: restore-ccache
      uses: actions/cache/restore@v5
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{runner.os}}-${{runner.arch}}-ccache-
        restore-keys: ${{runner.os}}-${{runner.arch}}-ccache-
    - name: Setup ccache
      run: |
        choco install -y ccache
        bash ./buildscripts/ci/tools/setup_ccache_config.sh

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.10.2
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets'
        cache: true
    - name: Setup environment
      run: |
        buildscripts\ci\windows\setup.bat --portable ON

    - name: Generate _en.ts files
      shell: bash
      env:
        LUPDATE_ARGS: ""
        POSTPROCESS_ARGS: "--warn-only ${{ env.DO_PLACEHOLDER_TRANSLATIONS == 'true' && '--generate-placeholder-translations' || '' }}"
        POSTPROCESS_LAUNCHER: "python3 -X utf8"
      run: |
        bash ./tools/translations/run_lupdate.sh
    - name: Update .ts files (tx pull)
      if: env.DO_UPDATE_TS == 'true'
      uses: cbjeukendrup/cli-action@windows
      with:
        token: ${{ secrets.TRANSIFEX_API_TOKEN }}
        args: "pull -f"
    - name: Build
      shell: cmd
      run: |
        IF ${{ env.SENTRY_URL != 0 }} == true ( SET C_URL="${{ env.SENTRY_URL }}" ) ELSE ( SET C_URL="" )
        buildscripts\ci\windows\build.bat --portable ON -n ${{ env.BUILD_NUMBER }} --crash_log_url %C_URL%
    - name: Show ccache stats
      run: |
        ccache -sv
    - name: Package
      shell: cmd
      run: |
        IF ${{ secrets.WIN_SIGN_S3_SECRET != 0 }} == true ( SET S_S=${{ secrets.WIN_SIGN_S3_SECRET }} ) ELSE ( SET S_S="''" )
        IF ${{ secrets.WIN_SIGN_S3_KEY != 0 }} == true ( SET S_K=${{ secrets.WIN_SIGN_S3_KEY }} ) ELSE ( SET S_K="''" )
        buildscripts\ci\windows\package.bat --portable ON  --signsecret %S_S% --signkey %S_K%
    - name: Checksum
      run: |
        bash ./buildscripts/ci/tools/checksum.sh
    - name: Publish to OSUOSL
      if: env.DO_PUBLISH == 'true'
      shell: bash
      run: |
        bash ./buildscripts/ci/tools/osuosl/publish.sh -s ${{ secrets.OSUOSL_SSH_ENCRYPT_SECRET }} --os windows -v 4 --arch x86_64
    - name: Upload artifacts on GitHub
      uses: actions/upload-artifact@v6
      with:
        name: ${{ env.UPLOAD_ARTIFACT_NAME }}
        path: build.artifacts\

    - name: Prepare ccache files for saving
      id: prepare-save-ccache
      if: always() && github.event_name != 'pull_request'
      shell: bash
      run: |
        ccache --recompress 10
        echo "CCACHE_TIMESTAMP=$(date -u +"%F-%T")" | tee -a $GITHUB_OUTPUT
    - name: Save ccache files
      if: always() && github.event_name != 'pull_request'
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-ccache.outputs.cache-primary-key }}${{ steps.prepare-save-ccache.outputs.CCACHE_TIMESTAMP }}
        path: ${{ github.workspace }}/.ccache

  # windows_sign_test:
  #   if: github.event_name != 'workflow_dispatch' || contains(inputs.platforms, 'sign_test')
  #   runs-on: windows-2025
  #   steps:
  #   - name: Clone repository
  #     uses: actions/checkout@v6
  #   - name: Sign test
  #     shell: cmd
  #     run: |
  #       IF ${{ secrets.WIN_SIGN_S3_SECRET != 0 }} == true ( SET S_S=${{ secrets.WIN_SIGN_S3_SECRET }} ) ELSE ( SET S_S="''" )
  #       IF ${{ secrets.WIN_SIGN_S3_KEY != 0 }} == true ( SET S_K=${{ secrets.WIN_SIGN_S3_KEY }} ) ELSE ( SET S_P="''" )
  #       buildscripts\ci\windows\sign_test.bat --secret %S_S% --key %S_K%
