name: 'Jubelle: Platform Reliability Tests'

# Fast (a few minutes) native tests of Jubelle's reliability code on Windows,
# macOS and Linux. Runs alongside the full application builds, which take ~1 hour.

on:
  push:
    branches: [ main, 'stavelle/**', 'jubelle/**', 'engine/**' ]
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Runners to test on (JSON list), e.g. ["windows-2025"] to save macOS minutes'
        default: '["windows-2025", "macos-latest", "ubuntu-latest"]'
        required: true
      engine_reference:
        description: 'Jubelle engine (S2): compare the native reader with MuseScore''s reading of every 4.x score (yes/no; ~1 hour)'
        default: 'no'
        required: false

jobs:
  platform_tests:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.inputs.platforms || '["windows-2025", "macos-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
    - name: Configure
      run: cmake -S tools/jubelle_platform_tests -B build-platform-tests -DCMAKE_BUILD_TYPE=Release
    - name: Build
      run: cmake --build build-platform-tests --config Release --parallel
    - name: Run tests
      run: ctest --test-dir build-platform-tests -C Release --output-on-failure
    - name: "Jubelle: every menu command is still in the menus"
      shell: bash
      run: python3 tools/jubelle_checks/menu_commands_check.py || python tools/jubelle_checks/menu_commands_check.py

  # Jubelle engine (engine/next): the standalone engine builds and its tests pass on every
  # platform, the sanitizers find nothing on Linux, and no private score is tracked (D-E17).
  jubelle_engine:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.inputs.platforms || '["windows-2025", "macos-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
    - name: No private scores in the repository
      shell: bash
      run: python3 tools/jubelle_checks/private_corpus_guard.py || python tools/jubelle_checks/private_corpus_guard.py
    - name: Configure, build and test the engine
      shell: bash
      run: |
        if [ ! -f jubelle_engine/CMakeLists.txt ]; then echo "no engine on this branch"; exit 0; fi
        cmake -S jubelle_engine -B build-je -DCMAKE_BUILD_TYPE=Release
        cmake --build build-je --config Release --parallel
        ctest --test-dir build-je -C Release --output-on-failure
    - name: Sanitizers (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [ ! -f jubelle_engine/CMakeLists.txt ]; then exit 0; fi
        cmake -S jubelle_engine -B build-je-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DJE_TSAN=ON
        cmake --build build-je-tsan --parallel && ./build-je-tsan/je_tests
        cmake -S jubelle_engine -B build-je-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DJE_SANITIZE=ON
        cmake --build build-je-asan --parallel && ./build-je-asan/je_tests
    - name: Benchmarks (informational)
      shell: bash
      run: |
        if [ ! -f jubelle_engine/CMakeLists.txt ]; then exit 0; fi
        B=build-je/je_bench; [ -f build-je/Release/je_bench.exe ] && B=build-je/Release/je_bench.exe
        "$B" | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Files (S2) - every repository score through the native reader and writer
      shell: bash
      run: |
        if [ ! -f jubelle_engine/corpus/known_issues.txt ]; then exit 0; fi
        T=build-je/je_io_tool; [ -f build-je/Release/je_io_tool.exe ] && T=build-je/Release/je_io_tool.exe
        "$T" corpus . --known jubelle_engine/corpus/known_issues.txt --report je_corpus.md > je_corpus.out; rc=$?
        { echo "### ${{ matrix.os }}"; cat je_corpus.md; } >> "$GITHUB_STEP_SUMMARY"
        exit $rc
    - name: Files (S2) - every 4.x score written from the model alone and read again (D-E27)
      shell: bash
      run: |
        if [ ! -f jubelle_engine/io/mscxwriter.cpp ]; then exit 0; fi
        T=build-je/je_io_tool; [ -f build-je/Release/je_io_tool.exe ] && T=build-je/Release/je_io_tool.exe
        "$T" regenerate . > je_regenerate.md; rc=$?
        { echo "### ${{ matrix.os }}"; cat je_regenerate.md; } >> "$GITHUB_STEP_SUMMARY"
        exit $rc
    - name: Files (S2) - reading and writing the large orchestra score (informational)
      shell: bash
      run: |
        if [ ! -f jubelle_engine/corpus/known_issues.txt ]; then exit 0; fi
        T=build-je/je_io_tool; [ -f build-je/Release/je_io_tool.exe ] && T=build-je/Release/je_io_tool.exe
        PY=python3; command -v python3 >/dev/null || PY=python
        $PY tools/jubelle_checks/make_large_score.py demos/Dawn.mscx large_orchestra.mscx
        "$T" bench large_orchestra.mscx | tee -a "$GITHUB_STEP_SUMMARY"

  # Jubelle engine (S2): the native reader against MuseScore's own reading (the comparison baseline), every
  # MuseScore 4.x score in the repository. MuseScore's engine runs only in this test tool.
  je_reference:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.engine_reference == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
    - name: Build MuseScore's engine test tool (reference) and the Jubelle engine's file tool
      run: |
        sudo apt-get install -y ninja-build > /dev/null
        cmake -S tools/jubelle_engine_tests -B build-et -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build-et --target jubelle_engine_tests
        cmake -S jubelle_engine -B build-je -DCMAKE_BUILD_TYPE=Release
        cmake --build build-je --target je_io_tool --parallel
    - name: Both readings of every 4.x score
      run: |
        python3 - <<'PY'
        import sys; sys.path.insert(0, "tools/jubelle_checks")
        from pathlib import Path
        from je_musescore_compat import is_v4
        files = sorted(str(p) for p in Path(".").rglob("*.msc[zx]") if ".git" not in p.parts and is_v4(p))
        Path("v4_scores.txt").write_text("\n".join(files) + "\n")
        print(len(files), "scores")
        PY
        JUBELLE_REFERENCE_ROOT=$PWD JUBELLE_REFERENCE_LIST=$PWD/v4_scores.txt JUBELLE_REFERENCE_OUT=$PWD/ref_listings \
          ./build-et/jubelle_engine_tests --gtest_filter='Jubelle_Reference.*'
        python3 tools/jubelle_checks/je_reference_compare.py build-je/je_io_tool . v4_scores.txt ref_listings je_reference.md \
          --expected jubelle_engine/corpus/reference_differences.txt; rc=$?
        cat je_reference.md >> "$GITHUB_STEP_SUMMARY"
        # S3, linked staves while editing: every score with a linked staff is edited on both staves by the engine and
        # saved (outside the repository, before the regenerated copies are made in it)
        ./build-je/je_io_tool linkedit . --out "$RUNNER_TEMP/linkedit" > linkedit.log || rc=1
        # S3, editing commands: every score edited with them (respell, accidentals, intervals, articulations, graces,
        # lines, voices), saved with the edited model's listing next to it
        ./build-je/je_io_tool cmdedit . --out "$RUNNER_TEMP/cmdedit" > cmdedit.log || rc=1
        if grep -q PROBLEMS cmdedit.log; then echo "::error::the editing commands left the model inconsistent"; rc=1; fi
        # and a time signature change (5/8 from the second measure: the music rewritten as MuseScore rewrites it)
        ./build-je/je_io_tool tsedit . --out "$RUNNER_TEMP/tsedit" 1 5 8 > tsedit.log || rc=1
        if grep -q PROBLEMS tsedit.log; then echo "::error::the time signature change left the model inconsistent"; rc=1; fi
        # the same scores written from the Jubelle model, read by MuseScore's engine: as it reads the originals
        ./build-je/je_io_tool regenerate . --out generated > /dev/null || rc=1
        (cd generated && find . -name '*.mscz' | sed 's|^\./||' | sort) > generated.txt
        JUBELLE_REFERENCE_ROOT=$PWD/generated JUBELLE_REFERENCE_LIST=$PWD/generated.txt JUBELLE_REFERENCE_OUT=$PWD/gen_listings \
          ./build-et/jubelle_engine_tests --gtest_filter='Jubelle_Reference.*'
        python3 tools/jubelle_checks/je_generated_compare.py generated generated.txt gen_listings ref_listings je_generated.md \
          --expected jubelle_engine/corpus/reference_differences.txt || rc=1
        cat je_generated.md >> "$GITHUB_STEP_SUMMARY"
        # and in detail (ties, slurs and other lines, articulations, spellings, annotations) and as MuseScore plays it
        # (its MIDI rendering)
        JUBELLE_REFERENCE_MIDI=1 JUBELLE_REFERENCE_DETAIL=1 JUBELLE_REFERENCE_ROOT=$PWD JUBELLE_REFERENCE_LIST=$PWD/v4_scores.txt JUBELLE_REFERENCE_OUT=$PWD/ref_detail \
          ./build-et/jubelle_engine_tests --gtest_filter='Jubelle_Reference.*'
        JUBELLE_REFERENCE_MIDI=1 JUBELLE_REFERENCE_DETAIL=1 JUBELLE_REFERENCE_ROOT=$PWD/generated JUBELLE_REFERENCE_LIST=$PWD/generated.txt JUBELLE_REFERENCE_OUT=$PWD/gen_detail \
          ./build-et/jubelle_engine_tests --gtest_filter='Jubelle_Reference.*'
        cat jubelle_engine/corpus/reference_differences.txt jubelle_engine/corpus/generated_playback_differences.txt > playback_expected.txt
        python3 tools/jubelle_checks/je_generated_compare.py generated generated.txt gen_detail ref_detail je_generated_detail.md \
          --expected playback_expected.txt || rc=1
        { echo; echo "### In detail"; cat je_generated_detail.md; } >> "$GITHUB_STEP_SUMMARY"
        # MuseScore's engine must read the same music on both linked staves and link the copies as in the original
        grep '^edited:' linkedit.log | sed 's/^edited: //; s/ (format.*//' > linked_originals.txt
        (cd "$RUNNER_TEMP/linkedit" && find . -name '*.mscz' | sed 's|^\./||' | sort) > linkedit.txt
        JUBELLE_REFERENCE_LINKS=1 JUBELLE_REFERENCE_ROOT=$PWD JUBELLE_REFERENCE_LIST=$PWD/linked_originals.txt JUBELLE_REFERENCE_OUT=$PWD/linked_ref \
          ./build-et/jubelle_engine_tests --gtest_filter='Jubelle_Reference.*'
        JUBELLE_REFERENCE_LINKS=1 JUBELLE_REFERENCE_ROOT="$RUNNER_TEMP/linkedit" JUBELLE_REFERENCE_LIST=$PWD/linkedit.txt JUBELLE_REFERENCE_OUT=$PWD/linkedit_ref \
          ./build-et/jubelle_engine_tests --gtest_filter='Jubelle_Reference.*'
        python3 tools/jubelle_checks/je_linked_compare.py linkedit.log linked_ref linkedit_ref je_linked.md || rc=1
        { echo; cat je_linked.md; } >> "$GITHUB_STEP_SUMMARY"
        # MuseScore's engine must read the commands' edits as the edited model holds them
        (cd "$RUNNER_TEMP/cmdedit" && find . -name '*.mscz' | sed 's|^\./||' | sort) > cmdedit.txt
        JUBELLE_REFERENCE_ROOT="$RUNNER_TEMP/cmdedit" JUBELLE_REFERENCE_LIST=$PWD/cmdedit.txt JUBELLE_REFERENCE_OUT=$PWD/cmdedit_ref \
          ./build-et/jubelle_engine_tests --gtest_filter='Jubelle_Reference.*'
        python3 tools/jubelle_checks/je_command_compare.py "$RUNNER_TEMP/cmdedit" cmdedit.txt cmdedit_ref je_commands.md \
          --expected jubelle_engine/corpus/reference_differences.txt || rc=1
        { echo; cat je_commands.md; } >> "$GITHUB_STEP_SUMMARY"
        (cd "$RUNNER_TEMP/tsedit" && find . -name '*.mscz' | sed 's|^\./||' | sort) > tsedit.txt
        JUBELLE_REFERENCE_ROOT="$RUNNER_TEMP/tsedit" JUBELLE_REFERENCE_LIST=$PWD/tsedit.txt JUBELLE_REFERENCE_OUT=$PWD/tsedit_ref \
          ./build-et/jubelle_engine_tests --gtest_filter='Jubelle_Reference.*'
        python3 tools/jubelle_checks/je_command_compare.py "$RUNNER_TEMP/tsedit" tsedit.txt tsedit_ref je_timesig.md \
          --expected jubelle_engine/corpus/reference_differences.txt || rc=1
        { echo; echo "### Time signature change"; cat je_timesig.md; } >> "$GITHUB_STEP_SUMMARY"
        # and against MuseScore's own command (Score::cmdAddTimeSig) on the originals: the same music expected
        mkdir -p "$RUNNER_TEMP/tsref"
        python3 tools/jubelle_checks/je_timesig_reference.py build-je/je_io_tool "$PWD/build-et/jubelle_engine_tests" "$PWD" \
          "$RUNNER_TEMP/tsref" 1 5 8 > je_timesig_reference.txt || rc=1
        { echo; echo '```'; cat je_timesig_reference.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        exit $rc
    - name: Upload the comparison
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: jubelle-engine-reference
        path: |
          je_reference.md
          je_generated.md
          je_generated_detail.md
          je_linked.md
          je_commands.md
          je_timesig.md
