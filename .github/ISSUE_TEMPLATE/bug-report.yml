name: Bug report
description: Report a crash or something in Jubelle that doesn't work as it should.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        **This repository is public.** Please don't attach private scores, crash logs or diagnostic files, or anything containing your name, file paths or account details. A small example score made just for this report is ideal.
  - type: dropdown
    id: label
    attributes:
      label: Issue type
      options:
        - Choose option...
        - Crash or freeze
        - Engraving (how the score looks)
        - Playback
        - Editing or interaction
        - Interface appearance
        - Projects, templates or New Score
        - Opening, saving, import or export
        - Installer or updates
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened, and how to make it happen again
      placeholder: |
        1. Open ...
        2. Click ...
        What happened:
        What I expected:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, short recordings or an example score
      description: Only material you're happy to make public.
  - type: input
    id: version
    attributes:
      label: Jubelle version
      description: "Help → About Jubelle, or the installer's file name (for example 4.7.7.261115023)."
    validations:
      required: true
  - type: dropdown
    id: musescore
    attributes:
      label: Does the same thing happen in MuseScore Studio 4.7.7?
      options:
        - Don't know / didn't check
        - "No, only in Jubelle"
        - "Yes, also in MuseScore Studio"
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, ...
    validations:
      required: true
