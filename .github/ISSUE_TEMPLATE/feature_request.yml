name: Feature request
description: Suggest a new feature or an improvement to Jubelle.
type: Feature
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: Describe it in a few sentences.
    validations:
      required: true
  - type: textarea
    id: whatfor
    attributes:
      label: What would it help with?
      description: The musical or practical problem it would solve.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: Examples from scores, or how other notation programs handle it.
