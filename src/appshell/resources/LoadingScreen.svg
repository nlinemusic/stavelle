<svg width="800" height="380" viewBox="0 0 800 380" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Jubelle startup screen background: charcoal with magenta and purple arcs. The logo, name and version are drawn by the app. -->
<defs>
<linearGradient id="arc" x1="420" y1="0" x2="800" y2="380" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#E600A9"/>
<stop offset="1" stop-color="#A855F7"/>
</linearGradient>
<clipPath id="frame"><rect width="800" height="380" rx="12"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="800" height="380" fill="#25252B"/>
<circle cx="760" cy="430" r="330" fill="#2E2E35"/>
<circle cx="760" cy="430" r="250" stroke="url(#arc)" stroke-width="3" opacity="0.9"/>
<circle cx="760" cy="430" r="190" stroke="#A855F7" stroke-width="1.5" opacity="0.5"/>
<circle cx="760" cy="430" r="130" stroke="#E600A9" stroke-width="1" opacity="0.35"/>
<rect x="0" y="376" width="800" height="4" fill="url(#arc)"/>
</g>
</svg>
